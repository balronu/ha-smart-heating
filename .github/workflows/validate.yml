name: Validate

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Frontend syntax
        run: node --check custom_components/smart_heating/frontend/smart-heating-card.js
      - name: JSON validation
        run: python -m unittest tests.test_json
      - name: Domain tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Diff check
        run: git diff --check
      - name: Private-reference scan
        run: '! grep -RInE "(^|[^0-9])192\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)|(^|[^0-9])10\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)|Bearer |api_key|access_token" --exclude-dir=.git --exclude=validate.yml .'

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned Home Assistant fixture
        run: python -m pip install --disable-pip-version-check "homeassistant==2026.10.4" "pytest-homeassistant-custom-component==0.13.375"
      - name: Run Config Flow and lifecycle fixture
        run: python -m unittest tests.test_runtime -v
