name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: JSON validation
        run: python -m unittest tests.test_json
      - name: Domain tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Diff check
        run: git diff --check
      - name: Private-reference scan
        run: '! grep -RInE "192\.168\.|10\.[0-9]+\.|token|Bearer |api_key|access_token" --exclude-dir=.git --exclude=validate.yml .'
