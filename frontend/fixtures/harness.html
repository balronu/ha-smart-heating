<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Smart Heating isolated UI fixture</title></head>
<body style="margin:0;background:#111;color:#eee"><smart-heating-card></smart-heating-card>
<script>
const days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
const state = { schedule: Object.fromEntries(days.map(day => [day, day === "monday" ? [{start:"05:30", end:"21:00"}] : []])), status: { mode:"comfort", actual_mode:"comfort", schedule_active:true, next_switch:"2026-10-31T21:00:00+01:00", target_temperature:22, target_hvac_mode:"heat", reason:"Langer Testtext für responsive Darstellung", special_modes:{party:false, visit:false, return_home:false, chimney_sweep:true}, heat_demand_status:"not_measured", observed:{climate:{state:"heat"}, outdoor_temperature:{state:"unbekannt"}, window_status:"unknown", heat_demand_status:"unknown"} }, options:{operation_mode:"compatibility", control_plane:{activation_allowed:false}} };
window.hass = { callWS: async (message) => { if (message.type.endsWith("plan/get")) return structuredClone(state); if (message.type.endsWith("plan/set")) { const invalid = Object.values(message.schedule).flat().some(w => w.start >= w.end); if (invalid) throw new Error("Ungültiger Zeitbereich"); state.schedule = structuredClone(message.schedule); return structuredClone(state); } throw new Error("Unbekannter Testbefehl"); } };
</script><script type="module" src="/custom_components/smart_heating/frontend/smart-heating-card.js"></script>
<script>customElements.whenDefined("smart-heating-card").then(() => { const card = document.querySelector("smart-heating-card"); card.setConfig({entry_id:"fixture", title:"Smart Heating – Rendered Fixture"}); card.hass = window.hass; });</script>
</body></html>
